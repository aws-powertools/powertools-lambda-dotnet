site_name: Powertools for AWS Lambda (.NET)
site_description: Powertools for AWS Lambda (.NET)
site_author: Amazon Web Services
repo_url: https://github.com/aws-powertools/powertools-lambda-dotnet
edit_uri: edit/develop/docs
site_url: https://docs.aws.amazon.com/powertools/dotnet/

nav:
  - Homepage: 
    - index.md
    - References: references.md
    - Changelog: changelog.md
    - Roadmap: roadmap.md
    - We Made This (Community): we_made_this.md
    - Workshop 🆕: https://s12d.com/powertools-for-aws-lambda-workshop" target="_blank
    - Getting started:
        - Logging:
            - getting-started/logger/simple.md
            - getting-started/logger/aspnet.md
            - getting-started/logger/aot.md
    - Features:
        - core/logging.md
        - core/metrics.md
        - core/tracing.md
        - utilities/idempotency.md
        - utilities/batch-processing.md
        - Event Handler:
            - core/event_handler/appsync_events.md
            - core/event_handler/bedrock_agent_function.md
        - utilities/parameters.md
        - utilities/jmespath-functions.md
        - utilities/kafka.md
    - Resources:
        - migration-guide-v2.md
        - migration-guide-v3.md
        - "llms.txt": ./llms.txt
        - "llms.txt (full version)": ./llms-full.txt
  - API Reference: api/" target="_blank
      
theme:
  name: material
  font:
    text: Ubuntu
  palette:  
    - scheme: default
      primary: blue
      accent: deep blue
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: deep blue
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - header.autohide
    - navigation.sections
    - navigation.top
    - navigation.tabs
    - navigation.instant
    - navigation.indexes
    - navigation.tracking
    - content.code.annotate
    - content.code.copy
    - toc.follow
    - announce.dismiss
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
  logo: media/aws-logo-light.svg
  favicon: media/aws-logo-light.svg
  custom_dir: docs/overrides

markdown_extensions:
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      linenums: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: "."
      check_paths: True
      dedent_subsections: true
  - meta
  - toc:
      permalink: true
      toc_depth: 4
  - attr_list
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - md_in_html
  
copyright: |
  <div id="awsdocs-legal-zone-copyright">
      <a href="https://aws.amazon.com/privacy" target="_blank" rel="nofollow">Privacy</a> |
      <a href="https://aws.amazon.com/terms/" target="_blank" rel="nofollow">Site terms</a> |
      <span class="copyright">
        © 2025, Amazon Web Services, Inc. or its affiliates. All rights reserved.
      </span>
  </div>

plugins:
  - privacy
  - git-revision-date
  - search
  - llmstxt:
      markdown_description: Powertools for AWS Lambda (.NET) is a developer toolkit to implement Serverless best practices and increase developer velocity. It provides a suite of utilities for AWS Lambda Functions that makes tracing with AWS X-Ray, structured logging and creating custom metrics asynchronously easier.
      full_output: llms-full.txt
      sections:
        Project Overview:
          - index.md
          - changelog.md
          - roadmap.md
        Core Utilities:
          - core/logging.md
          - core/metrics.md
          - core/tracing.md
        Utilities:
          - utilities/idempotency.md
          - utilities/batch-processing.md
          - utilities/parameters.md
          - utilities/jmespath-functions.md
          - core/event_handler/appsync_events.md
          - core/event_handler/bedrock_agent_function.md
          - utilities/kafka.md
        Getting Started:
          - getting-started/logger/simple.md
          - getting-started/logger/aspnet.md
          - getting-started/logger/aot.md
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascript/extra.js
  - https://docs.powertools.aws.dev/shared/mermaid.min.js
  - https://docs.aws.amazon.com/assets/js/awsdocs-boot.js

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aws-powertools/powertools-lambda-dotnet
    - icon: fontawesome/brands/discord
      link: https://discord.gg/B8zZKbbyET
      name: Join our Discord Server!
