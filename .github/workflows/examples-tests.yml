name: Examples Tests

on:
  push:
    paths:
      - "examples/**"
      - ".github/workflows/examples-tests.yml"
    branches: [develop]
  pull_request:
    paths:
      - "examples/**"
      - ".github/workflows/examples-tests.yml"
    branches: [develop]

permissions: {}

defaults:
  run:
    working-directory: ./examples

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # 6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Install global tools
        run: dotnet tool install --global Apache.Avro.Tools

      - name: Build
        run: dotnet build --configuration Release --no-restore /tl

      - name: Test Examples
        run: dotnet test --configuration Release --no-build --verbosity normal
