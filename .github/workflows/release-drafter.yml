name: Release Drafter

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions: {}

jobs:
  update_release_draft:
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
