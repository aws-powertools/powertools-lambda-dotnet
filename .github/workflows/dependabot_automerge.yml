# Experimental: AI-assisted auto-merge for low-risk Dependabot PRs.
# Tracking issue: https://github.com/aws-powertools/powertools-lambda-dotnet/issues/1228
#
# A one-shot agent (the `github-pr-label-actions` reference architecture from
# https://github.com/hjgraca/agentic-sdlc) judges whether a Dependabot PR is
# low-risk within an explicit, in-skill policy (patch/minor only — never
# major/unknown; combined CI green; manifest/lockfile-only diff). If so it
# approves and enables GitHub auto-merge (which still waits for all required
# checks); otherwise it comments why and holds the PR for a human. The agent
# works only through the GitHub API and never checks out or runs PR code.
#
# Security notes (see issue #1228):
#   * Triggered on `pull_request_target` so Dependabot PRs get a write token,
#     but gated to label == dependencies AND author == dependabot[bot]. The
#     checked-out tree is this base repo, never the PR head; the agent app is
#     fetched from npm, not from the PR. No PR code is ever run.
#   * All third-party actions are SHA-pinned to the exact versions already
#     trusted in this repo's secure_workflows.yml allowlist.
#
# Prerequisites (repo settings / variables — not created by this PR):
#   * Settings → General → Pull Requests → "Allow auto-merge" enabled.
#   * Settings → Actions → General → "Allow GitHub Actions to create and approve
#     pull requests" enabled.
#   * Repo variables AWS_ROLE_ARN (a Bedrock-only OIDC role) and AWS_REGION.
name: Dependabot auto-merge (experimental)

on:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  automerge:
    if: >-
      github.event.label.name == 'dependencies' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # assume the Bedrock OIDC role
      contents: write # required for GitHub to perform the eventual merge
      pull-requests: write # approve, comment, label, enable auto-merge
    steps:
      # Checks out THIS base repo (pull_request_target default), not the PR head.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Assume Bedrock role (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Fetch and run the agent from its own repo rather than vendoring a Node
      # app into this .NET tree. All workflow context reaches the step through
      # env vars (never interpolated into the shell) — only the repo slug and the
      # numeric PR id are used, never free-text PR fields.
      - name: Run dependabot-automerge agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npx --yes degit hjgraca/agentic-sdlc/examples/github-pr-label-actions ./.pr-agent
          cd ./.pr-agent
          npm ci
          ./node_modules/.bin/flue run pr-label-actions \
            --input "$(printf '{"message":"Act on GitHub PR %s#%s (dependencies label)."}' "$REPO" "$PR_NUMBER")"
