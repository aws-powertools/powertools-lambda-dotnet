name: Rebuild latest docs

#
# === Documentation hotfix ===
#
# 1. Trigger "Rebuild latest docs" workflow manually: https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
# 2. The docs are rebuilt from the branch the workflow runs on (develop by default) and published to the docs website

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  changelog:
    permissions:
      contents: write
    uses: ./.github/workflows/reusable_publish_changelog.yml

  release-docs:
    needs: changelog
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable_publish_docs.yml
