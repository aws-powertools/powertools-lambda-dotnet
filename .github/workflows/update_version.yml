name: Update Version File After Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read 

jobs:
  update-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.process_version.outputs.version }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          ref: develop
          fetch-depth: 0
          fetch-tags: true

      - name: Get version
        id: get_version
        run: |
          if [ "${EVENT_NAME}" = "release" ]; then
            echo "version=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          else
            VERSION=$(git describe --tags --abbrev=0)
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Process version
        id: process_version
        run: |
          VERSION="${RAW_VERSION}"
          # Remove 'v' prefix if present
          VERSION="${VERSION#v}"
          
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
        env:
          RAW_VERSION: ${{ steps.get_version.outputs.version }}

      - name: Write version to version.txt
        run: echo "${VERSION}" > version.txt
        env:
          VERSION: ${{ steps.process_version.outputs.version }}

      - name: Check if changes exist
        id: check_changes
        run: |
          git add version.txt
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR for version.txt update
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          commit-message: "chore: update version.txt to ${{ env.VERSION }}"
          branch: update-version-txt-${{ github.run_id }}
          base: develop
          title: "chore: update version to ${{ env.VERSION }}"
          body: |
            This PR updates version.txt to the latest release version.
            
            **Version**: ${{ env.VERSION }}
            **Release**: ${{ github.event_name == 'release' && github.event.release.html_url || format('https://github.com/{0}/releases/tag/v{1}', github.repository, env.VERSION) }}
            **Triggered by**: ${{ github.event_name }}
          labels: automation,version-update
          delete-branch: true

  trigger-changelog:
    needs: update-version
    permissions:
      contents: write       # create temporary branch to store changelog changes
      pull-requests: write  # create PR with changelog changes
    uses: ./.github/workflows/reusable_publish_changelog.yml