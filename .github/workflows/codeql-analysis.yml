name: "CodeQL"

on:
  push:
    paths:
      - "libraries/**"
      - ".github/workflows/codeql-analysis.yml"
    branches: [ "develop" ]
  pull_request:
    paths:
      - "libraries/**"
      - ".github/workflows/codeql-analysis.yml"
    branches: [ "develop" ]
  schedule:
    - cron: '42 8 * * 0'

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
      with:
        languages: ${{ matrix.language }}
        build-mode: manual
        
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # 6.1.0
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    # Build the libraries solution only, same as build.yml. Autobuild picked up every project
    # in the repo (including examples) and failed on newer SDKs preinstalled on the runner.
    - name: Build
      working-directory: ./libraries
      run: dotnet build AWS.Lambda.Powertools.sln --configuration Release /tl

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
