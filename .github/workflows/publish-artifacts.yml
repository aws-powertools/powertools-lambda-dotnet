# PROCESS
#
# 1. Build and pack all libraries in the solution
# 2. Point the docs snippets project at these local packages
# 3. Build the docs snippets to verify the packages can be consumed
# 4. Publish packages to GitHub Packages (on develop branch only)

# USAGE
#
# This workflow is triggered on push to the develop branch or manually via workflow_dispatch.

name: Publish Packages

on:
  workflow_dispatch:
  push:
    paths:
      - "libraries/**"
    branches:
      - develop

permissions: {}

jobs:
  pack-libraries:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # 6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build libraries
        run: dotnet build ./libraries/ --configuration Release

      - name: Pack libraries
        run: |
          mkdir -p ./packages
          VERSION_SUFFIX=${{ github.run_id }}
          dotnet pack ./libraries/ --configuration Release --no-build --output ./packages --version-suffix $VERSION_SUFFIX

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #7.0.1
        with:
          name: nuget-packages
          path: ./packages/
  
  verify-packages:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: pack-libraries
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # 6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: nuget-packages
          path: ./packages/

      - name: Configure local NuGet source
        run: |
          dotnet nuget add source ${{ github.workspace }}/packages --name local

      # Ensure we preserve access to NuGet.org
      - name: Configure NuGet.org source
        continue-on-error: true
        run: |
          dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org

      - name: Update docs snippets to use local packages
        run: |
          project=./docs/snippets/Snippets.csproj
          for package in ./packages/*.nupkg; do
            # Extract package name and version
            packageName=$(basename $package .nupkg | sed -E 's/(.*)\.([0-9]+\.[0-9]+\.[0-9]+.*)$/\1/')
            packageVersion=$(basename $package .nupkg | sed -E 's/(.*)\.([0-9]+\.[0-9]+\.[0-9]+.*)$/\2/')

            # Swap the ProjectReference for a PackageReference in place, keeping other attributes (e.g. Aliases)
            if grep -q "<ProjectReference Include=\"[^\"]*/$packageName\.csproj\"" "$project"; then
              echo "  - Converting ProjectReference $packageName to PackageReference version $packageVersion"
              sed -i -E "s#<ProjectReference Include=\"[^\"]*/$packageName\.csproj\"#<PackageReference Include=\"$packageName\" Version=\"$packageVersion\"#" "$project"
            fi
          done

          if grep -q "<ProjectReference Include=" "$project"; then
            echo "::error::Some ProjectReferences in $project have no matching package"
            grep "<ProjectReference Include=" "$project"
            exit 1
          fi

      - name: Build docs snippets
        run: dotnet build ./docs/snippets/ --configuration Release

  publish-packages:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify-packages
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: nuget-packages
          path: ./packages/

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # 6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup GitHub Packages source
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --name github

      - name: Publish packages to GitHub Packages
        run: |
          for package in ./packages/*.nupkg; do
            dotnet nuget push $package --source github --api-key ${{ secrets.GITHUB_TOKEN }}
          done
