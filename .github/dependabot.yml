version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docs
    schedule:
      interval: monthly
  
  - package-ecosystem: npm
    directories:
      - "/"
    labels: [ ]
    schedule:
      interval: monthly
    versioning-strategy: increase
    allow:
      - dependency-name: "aws-cdk"

  - package-ecosystem: nuget
    directories:
      - "/"
    labels: [ ]
    schedule:
      interval: monthly
