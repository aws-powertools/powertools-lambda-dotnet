version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # init, autobuild and analyze must run the same version
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: npm
    directories:
      - "/"
    labels: [ ]
    schedule:
      interval: monthly
    versioning-strategy: increase
    allow:
      - dependency-name: "aws-cdk"

  - package-ecosystem: nuget
    directories:
      - "/"
    labels: [ ]
    schedule:
      interval: monthly
