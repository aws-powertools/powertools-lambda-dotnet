version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # init, autobuild and analyze must run the same version
      codeql-action:
        patterns:
          - "github/codeql-action*"
    ignore:
      # The v2.6.0 image can't be pulled (ossf/scorecard-action#1752). Remove once a fixed release is out.
      - dependency-name: "ossf/scorecard-action"
        versions: ["2.6.0"]

  - package-ecosystem: npm
    directories:
      - "/"
    labels: [ ]
    schedule:
      interval: monthly
    versioning-strategy: increase
    allow:
      - dependency-name: "aws-cdk"

  - package-ecosystem: nuget
    directories:
      - "/"
    labels: [ ]
    schedule:
      interval: monthly
